async function processCloudSave() {
    cloudSaveTimer = null;

    // Jangan kirim request baru jika request sebelumnya masih berjalan.
    if (cloudSaveInFlight) {
        return;
    }

    if (!cloudSavePending) {
        return;
    }

    const dbToSend = cloudSavePending;
    cloudSavePending = null;

    cloudSaveInFlight = true;

    try {
        await saveDBToCloud(dbToSend);
    } catch (error) {
        console.error(
            'Gagal menyimpan database terbaru ke cloud:',
            error
        );
    } finally {
        cloudSaveInFlight = false;

        // Jika selama request berlangsung ada perubahan baru,
        // kirim snapshot terbaru setelah request selesai.
        if (cloudSavePending) {
            cloudSaveTimer = setTimeout(() => {
                processCloudSave();
            }, 100);
        }
    }
}

        async function saveDBToCloud(db) {
    if (IS_EMBEDDED_PREVIEW) {
        return { success: true, skipped: true };
    }

    const actor = db.currentUser
        ? {
            role: db.currentUser.role || null,
            id: db.currentUser.id || null,
            pangkalanId: db.currentUser.pangkalanId || null,
            name: db.currentUser.name || null
        }
        : {
            role: null,
            id: null,
            pangkalanId: null,
            name: null
        };

    const cloudDB = structuredClone(db);
    cloudDB.currentUser = null;

    const payload = JSON.stringify({
        action: 'saveDB',
        db: cloudDB,
        actor: actor
    });

            try {
                // text/plain is a CORS "simple request" and avoids preflight.
                // no-cors is intentional: the write is sent even when the
                // browser does not expose the Apps Script response to JS.
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-store',
                    keepalive: true,
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: payload
                });

                cloudDBReady = true;
                console.log('Database dikirim ke Google Apps Script.');
                return { success: true };

            } catch (error) {
                console.error('Fetch cloud gagal, mencoba sendBeacon:', error);

                try {
                    const blob = new Blob([payload], {
                        type: 'text/plain;charset=utf-8'
                    });

                    const sent = navigator.sendBeacon(API_URL, blob);

                    if (!sent) {
                        throw new Error('sendBeacon tidak dapat mengirim data.');
                    }

                    cloudDBReady = true;
                    console.log('Database dikirim menggunakan sendBeacon.');
                    return { success: true };

                } catch (beaconError) {
                    cloudDBReady = false;
                    console.error('Gagal mengirim database ke cloud:', beaconError);
                    throw beaconError;
                }
            }
        }

        async function loadDBFromCloud() {
            if (IS_EMBEDDED_PREVIEW) return false;
            if (cloudDBLoading) return false;

            cloudDBLoading = true;

            try {
                const response = await fetch(
                    API_URL + '?action=getDB&_=' + Date.now(),
                    {
                        method: 'GET',
                        cache: 'no-store'
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(
                        result.message || 'Gagal mengambil database.'
                    );
                }

                // Server belum memiliki database.
                // Hanya pada kondisi ini data lokal dijadikan data awal.
                if (!result.db) {
                    const localDB = getDB();
                    await saveDBToCloud(localDB);
                    cloudDBReady = true;
                    return true;
                }

                const cloudDB = normalizeDB(result.db);

                // currentUser adalah sesi browser ini, bukan data pusat.
                const localData = localStorage.getItem(DB_KEY);
                let localSession = null;

                if (localData) {
                    try {
                        localSession = JSON.parse(localData)?.currentUser || null;
                    } catch (e) {
                        localSession = null;
                    }
                }

                cloudDB.currentUser = localSession;

                localStorage.setItem(
                    DB_KEY,
                    JSON.stringify(cloudDB)
                );

                cloudDBReady = true;

                console.log('DATABASE ONLINE berhasil dimuat dari Google Sheet.');
                return true;

            } catch (error) {
                cloudDBReady = false;
                console.error('Gagal mengambil database cloud:', error);

                // Jangan membuat database cloud baru ketika GET gagal.
                // Gunakan cache lokal hanya sebagai mode offline.
                return false;

            } finally {
                cloudDBLoading = false;
            }
        }

            }

        function getPangkalanInventory(pangkalanId) {
            const db = getDB();
            const allocs = db.allocations.filter(a => a.pangkalanId === pangkalanId);
           const trxs = db.transactions.filter(
                    t => isActiveTransaction(t) &&
                         t.pangkalanId === pangkalanId
                );
            const returns = db.emptyReturnsToAgency.filter(r => r.pangkalanId === pangkalanId);

            const totalIsiMasuk = allocs.reduce((s, a) => s + Number(a.isi3kg || 0), 0);
            const totalIsiTerjual = trxs.reduce((s, t) => s + Number(t.qty3kg || 0), 0);

            // Stok gudang pangkalan = total kiriman/alokasi dari Super Admin
            // dikurangi seluruh transaksi penjualan yang masih tercatat.
            // Saat warung dihapus, transaksi warung ikut dihapus sehingga
            // stok otomatis kembali ke posisi sebelum kiriman ke warung tersebut.
            const stokIsiGudang = Math.max(0, totalIsiMasuk - totalIsiTerjual);

            const totalKosongDiterima = trxs.reduce((s, t) => s + Number(t.qtyKosongDiambil || 0), 0);
            const totalKosongDikembalikan = returns.reduce((s, r) => s + Number(r.qtyKosong || 0), 0);

            // Penerimaan kosong terbaru dari warung tetap ditampilkan terpisah
            // agar setoran sebelumnya ke agen tidak membuat penerimaan baru
            // terlihat hilang pada dashboard.
            const transaksiKosongTerbaru = trxs
                .filter(t => Number(t.qtyKosongDiambil || 0) > 0)
                .slice()
                .sort((a, b) => String(b.createdAt || b.date || '').localeCompare(String(a.createdAt || a.date || '')));

            const penerimaanKosongTerbaru = transaksiKosongTerbaru.length
                ? Number(transaksiKosongTerbaru[0].qtyKosongDiambil || 0)
                : 0;
            const tanggalPenerimaanKosongTerbaru = transaksiKosongTerbaru.length
                ? (transaksiKosongTerbaru[0].date || '-')
                : '-';

            // Stok kosong pangkalan adalah stok kosong yang diterima dari transaksi,
            // dikurangi yang sudah disetor ke agen, ditambah stok kosong yang
            // dikembalikan ke pangkalan ketika histori warung dihapus.
            const totalKosongPenyesuaian = (db.pangkalanStockAdjustments || [])
                    .filter(a =>
                    a.pangkalanId === pangkalanId &&
                    a.source !== 'warung_deleted'
                    )
                    .reduce((s, a) => s + Number(a.emptyQty || 0), 0);

            const stokKosongFisik = Math.max(
                0,
                totalKosongDiterima + totalKosongPenyesuaian - totalKosongDikembalikan
            );

            const totalOmset = trxs.reduce((s, t) => s + Number(t.totalHarga || 0), 0);
            const totalTerbayar = trxs.reduce((s, t) => s + Number(t.bayar || 0), 0);
            const totalSisaPiutang = Math.max(0, totalOmset - totalTerbayar);
            const totalProfitMargin = trxs.reduce((s, t) => s + (Number(t.qty3kg || 0) * (Number(t.hargaJual || 0) - Number(t.modalPerTabung || HET_PEMERINTAH))), 0);

            return {
                totalIsiMasuk,
                totalIsiTerjual,
                stokIsiGudang,
                stokKosongFisik,
                totalKosongDiterima,
                totalKosongDikembalikan,
                totalKosongDisetorAgen: totalKosongDikembalikan,
                penerimaanKosongTerbaru,
                tanggalPenerimaanKosongTerbaru,
                totalOmset,
                totalTerbayar,
                totalSisaPiutang,
                totalProfitMargin
            };
        }

function getWarungInventory(customerId) {
    const db = getDB();

   const trxs = (db.transactions || []).filter(
            t =>
                isActiveTransaction(t) &&
                String(t.customerId) === String(customerId)
    );

    const sales = (db.warungSales || []).filter(
        s => String(s.customerId) === String(customerId)
    );

    // ========================================================
    // TOTAL TABUNG ISI YANG PERNAH DIKIRIM KE WARUNG
    // ========================================================

    const totalIsiDiterima = trxs.reduce(
        (s, t) => s + Number(t.qty3kg || 0),
        0
    );

    // ========================================================
    // TOTAL TABUNG KOSONG YANG DITARIK PANGKALAN
    // ========================================================

    const totalKosongDitarikPangkalan = trxs.reduce(
        (s, t) => s + Number(t.qtyKosongDiambil || 0),
        0
    );

    // ========================================================
    // TOTAL PENJUALAN ECERAN WARUNG
    // ========================================================

    const totalPenjualanEceran = sales.reduce(
        (s, x) => s + Number(x.qty || 0),
        0
    );

    // ========================================================
    // TAGIHAN
    // ========================================================

    const totalTagihan = trxs.reduce(
        (s, t) => s + Number(t.totalHarga || 0),
        0
    );

    const totalSudahDibayar = trxs.reduce(
        (s, t) => s + Number(t.bayar || 0),
        0
    );

    const sisaHutang = Math.max(
        0,
        totalTagihan - totalSudahDibayar
    );

    // ========================================================
    // HITUNG STOK ISI WARUNG
    //
    // Rumus:
    // Isi diterima
    // - kosong yang sudah ditarik
    // - penjualan eceran
    //
    // CATATAN:
    // transaksi "tarik_kosong" hanya mengambil tabung kosong
    // sehingga TIDAK mengurangi stok isi.
    // ========================================================

    const totalKosongDitarikDariTransaksi = trxs.reduce(
        (s, t) => {

            if (
                String(t.jenisTransaksi || '') ===
                'tarik_kosong'
            ) {
                return s;
            }

            return s + Math.min(
                Number(t.qtyKosongDiambil || 0),
                Number(t.qty3kg || 0)
            );
        },
        0
    );

    const stokIsi = Math.max(
        0,
        totalIsiDiterima -
        totalKosongDitarikDariTransaksi -
        totalPenjualanEceran
    );

    // ========================================================
    // HITUNG STOK KOSONG WARUNG
    // Berdasarkan pergerakan tabung
    // ========================================================

    const movements = [];

    // Pengambilan kosong oleh pangkalan
    trxs.forEach(t => {

        // Mode tarik_kosong memang mengurangi
        // stok kosong warung.
        movements.push({
            type: 'ambilKosong',
            qty: Number(t.qtyKosongDiambil || 0),
            date:
                t.date ||
                t.createdAt ||
                t.timestamp ||
                ''
        });
    });

    // Penjualan eceran mengubah tabung isi menjadi kosong
    sales.forEach(s => {

        movements.push({
            type: 'penjualan',
            qty: Number(s.qty || 0),
            date:
                s.date ||
                s.createdAt ||
                s.timestamp ||
                ''
        });
    });

    // Urutkan berdasarkan waktu
    movements.sort((a, b) => {

        const dateA =
            new Date(a.date || 0).getTime();

        const dateB =
            new Date(b.date || 0).getTime();

        return dateA - dateB;
    });

    let stokKosong = 0;

    movements.forEach(movement => {

        if (movement.type === 'ambilKosong') {

            stokKosong -= movement.qty;

        } else if (movement.type === 'penjualan') {

            stokKosong += movement.qty;
        }

        // Stok fisik tidak boleh negatif
        stokKosong = Math.max(
            0,
            stokKosong
        );
    });

    // ========================================================
    // TOTAL TABUNG FISIK DI WARUNG
    // ========================================================

    const totalTabungFisik =
        stokIsi + stokKosong;

    return {
        totalIsiDiterima,

        totalKosongDitarikPangkalan,

        totalPenjualanEceran,

        totalTagihan,

        totalSudahDibayar,

        sisaHutang,

        estimasiStokIsiWarung:
            stokIsi,

        estimasiStokKosongWarung:
            stokKosong,

        totalTabungFisik
    };
}

        function showAlert(title, message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-900 text-white border-emerald-500/30' : 'bg-rose-900 text-white border-rose-500/30';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-rose-400';
            
            toast.className = `${bgClass} px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto border`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><div><h5 class="font-bold text-xs">${title}</h5><p class="text-[11px] text-slate-200 mt-0.5">${message}</p></div>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function handleLogin(e) {
    e.preventDefault();

    const username =
        document.getElementById('loginUsername').value.trim();

    const password =
        document.getElementById('loginPassword').value.trim();

    if (!username || !password) {
        showAlert(
            'Gagal Masuk',
            'Username dan password wajib diisi.',
            'error'
        );
        return;
    }

    const button = e.submitter;
    const originalText = button?.innerHTML;

    if (button) {
        button.disabled = true;
        button.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin text-xs"></i>
            <span>Memeriksa...</span>
        `;
    }

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
                action: 'login',
                username: username,
                password: password
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        console.log('HASIL LOGIN API:', result);

        if (!result.success || !result.user) {
            showAlert(
                'Gagal Masuk',
                result.message || 'Username atau password salah.',
                'error'
            );
            return;
        }

        const apiUser = result.user;

        // Normalisasi role dari backend
        // ke role yang digunakan frontend.
        let frontendRole = '';

        switch (String(apiUser.role || '').toUpperCase()) {

            case 'ADMIN_PANGKALAN':
            case 'ADMIN':
                frontendRole = 'admin';
                break;

            case 'SUPER_ADMIN':
            case 'SUPERADMIN':
                frontendRole = 'superadmin';
                break;

            case 'WARUNG':
                frontendRole = 'warung';
                break;

            case 'PERORANGAN':
            case 'PELANGGAN':
                frontendRole = 'perorangan';
                break;

            default:
                throw new Error(
                    `Role "${apiUser.role}" belum dikenali frontend.`
                );
        }

        /*
         * Simpan hanya sesi login.
         * Tidak menggunakan saveDB().
         */
        const currentUser = {
            id: apiUser.id || null,
            name: apiUser.name || username,
            username: apiUser.username || username,
            role: frontendRole,
            pangkalanId: apiUser.pangkalanId || null
        };

        const db = getDB();

        db.currentUser = currentUser;

        localStorage.setItem(
            DB_KEY,
            JSON.stringify(normalizeDB(db))
        );

        console.log('SESSION LOGIN:', currentUser);

        showAlert(
            'Berhasil Masuk',
            `Selamat datang, ${currentUser.name}!`
        );

        render();

    } catch (error) {

        console.error('LOGIN API ERROR:', error);

        showAlert(
            'Gagal Terhubung',
            'Tidak dapat menghubungi database pusat. Periksa koneksi internet atau URL Apps Script.',
            'error'
        );

    } finally {

        if (button) {
            button.disabled = false;

            button.innerHTML = originalText || `
                <span>Masuk</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            `;
        }
    }
}
        function handleLogout() {
            const db = getDB();
            db.currentUser = null;
            saveDB(db); showAlert('Keluar Sesi', 'Anda telah keluar dari sistem.'); render();
        }

    /*
     * TAHAP PERBAIKAN FRONTEND:

     * Auto-refresh cloud admin dihentikan sementara.
     * Sebelumnya loadDBFromCloud() berjalan setiap 3 detik dan dapat
     * mengganti db.customers lokal dengan snapshot Google Sheet yang
     * masih lama. Akibatnya pelanggan baru sempat muncul lalu hilang.
     *
     * saveDB() tetap berjalan dan tetap mengirim snapshot terbaru ke
     * Google Apps Script. Backend akan diperbaiki pada tahap berikutnya.

    return;
}

        function submitAddPangkalan(e) {

                address,
                username,
                password,
                phone: ''

        function deletePangkalan(id) {
            const db = getDB();
            const pangIndex = db.pangalans.findIndex(p => p.id === id);
            if (pangIndex === -1) return;

            const deletedName = db.pangalans[pangIndex].name;

            // Saat pangkalan dihapus, seluruh alokasi yang pernah dikirim
            // ke pangkalan tersebut dikembalikan ke stok gudang pusat.
            const totalAlokasiDikembalikan = (db.allocations || [])
                .filter(a => a.pangkalanId === id)
                .reduce((sum, a) => sum + Number(a.isi3kg || 0), 0);

            if (!db.superAdminStock) {
                db.superAdminStock = { isi3kg: 0, kosong3kg: 0 };
            }

            db.superAdminStock.isi3kg =
                Number(db.superAdminStock.isi3kg || 0) + totalAlokasiDikembalikan;

            // Hapus seluruh data yang terkait dengan pangkalan agar
            // akun/data cabang yang sudah dihapus tidak tersisa.
            db.allocations = (db.allocations || []).filter(a => a.pangkalanId !== id);
            db.transactions = (db.transactions || []).filter(t => t.pangkalanId !== id);
            db.emptyReturnsToAgency = (db.emptyReturnsToAgency || []).filter(r => r.pangkalanId !== id);
            db.warungReports = (db.warungReports || []).filter(r => r.pangkalanId !== id);
            db.customers = (db.customers || []).filter(c => c.pangkalanId !== id);

            // Hapus pangkalan.
            db.pangalans.splice(pangIndex, 1);

            // Jika admin yang sedang login adalah pangkalan yang dihapus,
            // putuskan sesi agar tidak ada akses ke dashboard yang sudah dihapus.
            if (db.currentUser?.role === 'admin' && db.currentUser?.pangkalanId === id) {
                db.currentUser = null;
            }

            saveDB(db);
            closeModal();

            const pesanStok = totalAlokasiDikembalikan > 0
                ? ` ${totalAlokasiDikembalikan} tabung isi dikembalikan ke stok gudang pusat.`
                : ' Tidak ada alokasi tabung yang perlu dikembalikan.';

            showAlert(
                'Pangkalan Dihapus',
                `Pangkalan ${deletedName} berhasil dihapus.${pesanStok}`
            );

            render();
        }

        function ensureEmptyAgencyReceiptData() {
            const db = getDB();
            if (!db.emptyAgencyReceipts) db.emptyAgencyReceipts = [];

            // Jangan migrasikan ledger lama jika wadah Super Admin pernah di-reset.
            // Setelah reset, wadah baru akan mulai dari nol dan hanya menerima
            // setoran yang dilakukan setelah reset.
            if (!db.emptyAgencyReceiptMigrationReset) {
                const existingIds = new Set(db.emptyAgencyReceipts.map(r => r.id));
                (db.emptyReturnsToAgency || []).forEach(r => {
                    if (existingIds.has(r.id)) return;
                    db.emptyAgencyReceipts.push({
                        id: r.id,
                        pangkalanId: r.pangkalanId,
                        pangkalanName: r.pangkalanName || r.pangkalanId,
                        date: r.date || '',
                        createdAt: r.createdAt || r.date || '',
                        qtyKosong: Number(r.qtyKosong || 0),
                        status: 'Diterima',
                        keterangan: 'Setoran tabung kosong dari Admin Pangkalan'
                    });
                });

                if (!db.superAdminStock) db.superAdminStock = { isi3kg: 0, kosong3kg: 0 };
                const ledgerTotal = db.emptyAgencyReceipts.reduce((s,r) => s + Number(r.qtyKosong || 0), 0);
                if (ledgerTotal > Number(db.superAdminStock.kosong3kg || 0)) {
                    db.superAdminStock.kosong3kg = ledgerTotal;
                }
            }

            saveDB(db);
            return db;
        }

function saveEditedAllocations(pId) {
    const db = getDB();

    const pang = (db.pangalans || []).find(p => p.id === pId);
    if (!pang) return;

    const allocations = (db.allocations || [])
        .filter(a => a.pangkalanId === pId);

    if (!allocations.length) {
        closeModal();
        return;
    }

    const totalTerjual = (db.transactions || [])
        .filter(t => t.pangkalanId === pId)
        .reduce(
            (sum, t) => sum + Number(t.qty3kg || 0),
            0
        );

    let oldTotal = 0;
    let newTotal = 0;

    const updates = [];

    for (const a of allocations) {

        const oldQty = Number(a.isi3kg || 0);

        const qtyInput = document.getElementById(`allocQty_${a.id}`);
        const dateInput = document.getElementById(`allocDate_${a.id}`);
        const statusInput = document.getElementById(`allocStatus_${a.id}`);

        const newQty = Math.max(
            0,
            Number(qtyInput?.value || 0)
        );

        const newDate = dateInput?.value || a.date;

        const newStatus =
            statusInput?.value || a.status || 'Terkirim';

        oldTotal += oldQty;
        newTotal += newQty;

        updates.push({
            allocation: a,
            oldQty,
            newQty,
            newDate,
            newStatus
        });
    }

    /*
     * Jangan izinkan total alokasi turun di bawah
     * jumlah tabung yang sudah terjual.
     */
    if (newTotal < totalTerjual) {
        showAlert(
            'Alokasi Tidak Valid',
            `Total alokasi ${newTotal} tabung tidak boleh lebih kecil dari total penjualan ${totalTerjual} tabung.`,
            'error'
        );
        return;
    }

    /*
     * Selisih positif:
     * Admin menambah alokasi → stok pusat berkurang.
     *
     * Selisih negatif:
     * Admin mengurangi alokasi → stok pusat bertambah.
     */
    const delta = newTotal - oldTotal;

    const stockPusat =
        Number(db.superAdminStock?.isi3kg || 0);

    if (delta > stockPusat) {
        showAlert(
            'Stok Gudang Tidak Cukup',
            `Tambahan alokasi ${delta} tabung melebihi stok gudang pusat ${stockPusat} tabung.`,
            'error'
        );
        return;
    }

    if (!db.superAdminStock) {
        db.superAdminStock = {
            isi3kg: 0,
            kosong3kg: 0
        };
    }

    /*
     * Terapkan perubahan setiap record.
     */
    updates.forEach(item => {

        item.allocation.isi3kg = item.newQty;
        item.allocation.date = item.newDate;
        item.allocation.status = item.newStatus;
        item.allocation.updatedAt =
            new Date().toISOString();

    });

    /*
     * Koreksi stok gudang pusat berdasarkan selisih.
     */
    db.superAdminStock.isi3kg =
        Math.max(
            0,
            stockPusat - delta
        );

    saveDB(db);

    closeModal();
    render();

    showAlert(
        'Alokasi Diperbarui',
        `Alokasi ${pang.name} berhasil diperbarui. Total alokasi sekarang ${newTotal} tabung.`
    );
}

        function printWarungHistory() {
            const popup = document.querySelector('.warung-history-popup');
            if (!popup) {
                showAlert('Print Gagal', 'Detail histori belum terbuka.', 'error');
                return;
            }

            const summary = popup.querySelector('.history-summary');
            const detailTable = popup.querySelector('.history-table');

            if (!summary || !detailTable) {
                showAlert('Print Gagal', 'Data histori belum siap untuk dicetak.', 'error');
                return;
            }

            const printRoot = document.createElement('div');
            printRoot.id = 'warungHistoryPrintRoot';

            const title = document.getElementById('modalTitle')?.innerText || 'Histori Transaksi Warung';
            const subtitle = document.getElementById('modalSubtitle')?.innerText || '';

            printRoot.innerHTML = `
                <div class="warung-history-print-document">
                    <div class="warung-history-print-header">
                        <h1>${title}</h1>
                        <p>${subtitle}</p>
                        <p class="warung-history-print-date">
                            Dicetak: ${new Date().toLocaleString('id-ID')}
                        </p>
                    </div>
                    <div class="warung-history-print-summary">${summary.outerHTML}</div>
                    <div class="warung-history-print-detail">
                        <table>${detailTable.innerHTML}</table>
                    </div>
                </div>
            `;

            document.body.appendChild(printRoot);
            document.body.classList.add('printing-warung-history');

            // Panggil print LANGSUNG dari event klik agar browser tidak kehilangan
            // user activation. Tidak ada window.open dan tidak ada setTimeout sebelum print.
            const cleanup = () => {
                document.body.classList.remove('printing-warung-history');
                printRoot.remove();
                window.removeEventListener('afterprint', cleanup);
            };

            window.addEventListener('afterprint', cleanup);

            try {
                window.print();
            } catch (err) {
                cleanup();
                showAlert('Print Gagal', 'Browser tidak dapat membuka dialog cetak. Silakan gunakan Ctrl+P.', 'error');
            }
        }

            const mode = document.querySelector('input[name="tlMode"]:checked')?.value;

            if (!isiInput) return;

        function submitTindakLanjut(e, reportId) {
            e.preventDefault();

            const db = getDB();
            const report = db.warungReports.find(r => r.id === reportId);
            if (!report) return;

            const pangId = db.currentUser.pangkalanId;
            const mode = document.querySelector('input[name="tlMode"]:checked')?.value || 'tukar';

            const isiInput = document.getElementById('tlKirimIsi');
            const kosongInput = document.getElementById('tlTarikKosong');
            const bayarInput = document.getElementById('tlBayar');

            const qtyKosong = Math.max(0, Number(kosongInput?.value || 0));
            const qtyIsi = mode === 'tarik_kosong'
                ? 0
                : Math.max(0, Number(isiInput?.value || 0));

            // MODE KHUSUS: hanya menarik tabung kosong.
            // Tidak ada penjualan gas isi, tidak ada tagihan, dan tidak mengurangi stok isi.
            if (mode === 'tarik_kosong') {
                if (qtyKosong <= 0) {
                    showAlert('Proses Gagal', 'Masukkan jumlah tabung kosong yang akan ditarik.', 'error');
                    return;
                }

                const stokWarung = getWarungInventory(report.customerId);
                if (qtyKosong > Number(stokWarung.estimasiStokKosongWarung || 0)) {
                    showAlert(
                        'Proses Gagal',
                        `Stok tabung kosong warung hanya ${Number(stokWarung.estimasiStokKosongWarung || 0)} unit.`,
                        'error'
                    );
                    return;
                }

                // Catat transaksi khusus pengambilan tabung kosong.
                // qty3kg = 0 => tidak mengurangi stok gas isi.
                // qtyKosongDiambil = jumlah tabung kosong yang kembali ke pangkalan.
                db.transactions.push({
                    id: 'trx_empty_return_' + Date.now(),
                    pangkalanId: pangId,
                    date: new Date().toISOString().slice(0, 10),
                    createdAt: new Date().toISOString(),
                    customerId: report.customerId,
                    customerName: report.warungName,
                    customerType: 'warung',
                    jenisTransaksi: 'tarik_kosong',
                    modePenukaran: 'tarik_kosong',
                    qty3kg: 0,
                    qtyKosongDiambil: qtyKosong,
                    modalPerTabung: 0,
                    hargaJual: 0,
                    hargaJualPerTabung: 0,
                    totalHarga: 0,
                    bayar: 0,
                    statusBayar: 'lunas',
                    catatan: 'Hanya Tarik Tabung Kosong - Tanpa Pengiriman Tabung Isi'
                });

                report.status = 'processed';
                report.processedMode = 'tarik_kosong';
                report.processedQtyIsi = 0;
                report.processedQtyKosong = qtyKosong;
                report.processedTotal = 0;

                saveDB(db);
                closeModal();

                showAlert(
                    'Berhasil',
                    `${qtyKosong} tabung kosong berhasil ditarik dari warung tanpa mengirim tabung isi.`
                );
                render();
                return;
            }

            // MODE NORMAL: Tukar + Kirim Isi.
            const inv = getPangkalanInventory(pangId);

            if (qtyIsi < 0 || qtyKosong < 0) {
                showAlert('Transaksi Gagal', 'Jumlah tabung tidak boleh negatif.', 'error');
                return;
            }

            if (qtyIsi > Number(inv.stokIsiGudang || 0)) {
                showAlert(
                    'Transaksi Gagal',
                    `Stok gas isi di pangkalan (${Number(inv.stokIsiGudang || 0)} unit) tidak mencukupi!`,
                    'error'
                );
                return;
            }

            // Harga selalu mengikuti transaksi pertama warung.
            const firstTrx = (db.transactions || [])
                .filter(t =>
                    t.customerId === report.customerId &&
                    Number(t.qty3kg || 0) > 0 &&
                    t.jenisTransaksi !== 'tarik_kosong'
                )
                .sort((a, b) => {
                    const da = String(a.createdAt || a.date || '');
                    const dbb = String(b.createdAt || b.date || '');
                    return da.localeCompare(dbb);
                })[0];

            const harga = firstTrx
                ? Number(
                    firstTrx.hargaJualPerTabung ||
                    firstTrx.hargaJual ||
                    firstTrx.hargaPerTabung ||
                    (Number(firstTrx.totalHarga || 0) / Math.max(1, Number(firstTrx.qty3kg || 0))) ||
                    HARGA_JUAL_STANDAR
                )
                : HARGA_JUAL_STANDAR;

            const total = qtyIsi * harga;
            const bayar = Math.max(0, Number(bayarInput?.value || 0));

            if (bayar > total) {
                showAlert('Transaksi Gagal', 'Pembayaran tidak boleh melebihi total tagihan.', 'error');
                return;
            }

            db.transactions.push({
                id: 'trx_' + Date.now(),
                pangkalanId: pangId,
                date: new Date().toISOString().slice(0, 10),
                createdAt: new Date().toISOString(),
                customerId: report.customerId,
                customerName: report.warungName,
                customerType: 'warung',
                jenisTransaksi: 'penukaran',
                modePenukaran: 'tukar',
                qty3kg: qtyIsi,
                qtyKosongDiambil: qtyKosong,
                modalPerTabung: HET_PEMERINTAH,
                hargaJual: harga,
                hargaJualPerTabung: harga,
                totalHarga: total,
                bayar: bayar,
                statusBayar: bayar >= total ? 'lunas' : 'belum_lunas',
                catatan: 'Penukaran Tabung Kosong & Pengiriman Tabung Isi'
            });

            report.status = 'processed';

            saveDB(db);
            closeModal();

            showAlert(
                'Penukaran Berhasil',
                `${qtyIsi} tabung isi dikirim dan ${qtyKosong} tabung kosong ditarik.`
            );
            render();
        }

        async function deleteWarung(customerId) {
            const db = getDB();
            const pangId = db.currentUser?.pangkalanId;

            if (!pangId) {
                showAlert('Gagal', 'Pangkalan aktif tidak ditemukan.', 'error');
                return;
            }

            const customer = (db.customers || []).find(c =>
                String(c.id) === String(customerId) &&
                String(c.pangkalanId) === String(pangId)
            );

            if (!customer) {
                showAlert('Gagal', 'Pelanggan tidak ditemukan pada pangkalan ini.', 'error');
                return;
            }

            customerDeletionInProgress = true;
            stopAdminCloudAutoRefresh();

            try {
                // Hentikan snapshot lama agar tidak menulis ulang customer yang sedang dihapus.
                clearTimeout(cloudSaveTimer);
                cloudSaveTimer = null;
                cloudSavePending = null;

                while (cloudSaveInFlight) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                const payload = JSON.stringify({
                    action: 'deleteCustomer',
                    customerId: customer.id,
                    pangkalanId: pangId,
                    actor: db.currentUser
                        ? {
                            role: db.currentUser.role || null,
                            id: db.currentUser.id || null,
                            pangkalanId: db.currentUser.pangkalanId || null,
                            name: db.currentUser.name || null
                        }
                        : null
                });

                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-store',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: payload
                });

                // Beri waktu Apps Script menyelesaikan penulisan DATABASE!A1.
                await new Promise(resolve => setTimeout(resolve, 700));

                await loadDBFromCloud();
                let cloudDB = getDB();
                let masihAda = (cloudDB.customers || []).some(c =>
                    String(c.id) === String(customer.id)
                );

                // Retry satu kali jika GET pertama masih melihat data lama.
                if (masihAda) {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        cache: 'no-store',
                        headers: {
                            'Content-Type': 'text/plain;charset=utf-8'
                        },
                        body: payload
                    });

                    await new Promise(resolve => setTimeout(resolve, 700));
                    await loadDBFromCloud();
                    cloudDB = getDB();
                    masihAda = (cloudDB.customers || []).some(c =>
                        String(c.id) === String(customer.id)
                    );
                }

                if (masihAda) {
                    throw new Error('Data masih ada di database pusat. Penghapusan belum berhasil.');
                }

                closeModal();
                showAlert(
                    'Berhasil Dihapus',
                    `${customer.name} berhasil dihapus dari pangkalan.`
                );
                render();

            } catch (error) {
                console.error('Gagal menghapus customer:', error);
                await loadDBFromCloud();
                render();
                showAlert(
                    'Gagal',
                    error.message || 'Penghapusan gagal diproses ke database pusat.',
                    'error'
                );
            } finally {
                customerDeletionInProgress = false;
                startAdminCloudAutoRefresh();
            }
        }

        function toggleTransactionBuyerMode() {
    const select = document.getElementById('trxCustId');
    const box = document.getElementById('trxNewPersonBox');
    const nameInput = document.getElementById('trxNewPersonName');

    if (!select || !box || !nameInput) return;

        select.value === '__perorangan_baru__';

    nameInput.required = isNewPerson;

    if (!isNewPerson) {

        function calcTrxTotal() {
            const qty = Number(document.getElementById('trxQty')?.value || 0);
            const hpp = Math.max(0, Number(document.getElementById('trxHpp')?.value || HET_PEMERINTAH));
            const hargaJual = Math.max(0, Number(document.getElementById('trxHargaJual')?.value || HARGA_JUAL_STANDAR));
            const totalHpp = qty * hpp;
            const total = qty * hargaJual;
            const profit = total - totalHpp;
            const display = document.getElementById('trxTotalDisplay');
            const hppDisplay = document.getElementById('trxHppTotalDisplay');
            const profitDisplay = document.getElementById('trxProfitDisplay');
            const bayarInput = document.getElementById('trxBayar');

            if (display) display.innerText = `Rp ${total.toLocaleString('id-ID')}`;
            if (hppDisplay) hppDisplay.innerText = `Rp ${totalHpp.toLocaleString('id-ID')}`;
            if (profitDisplay) {
                profitDisplay.innerText = `Rp ${profit.toLocaleString('id-ID')}`;
                profitDisplay.className = profit >= 0
                    ? 'text-sm font-extrabold text-emerald-700'
                    : 'text-sm font-extrabold text-rose-700';
            }
            if (bayarInput) {
                bayarInput.max = Math.max(1, total);
                const current = Number(bayarInput.value || 0);
                if (current > total) bayarInput.value = total;
            }
            updateTrxPaymentSummary();
        }

        function toggleTrxPaymentMode() {
            const mode = document.getElementById('trxPaymentMode')?.value;
            const box = document.getElementById('trxPartialPaymentBox');
            const bayarInput = document.getElementById('trxBayar');
            const qty = Number(document.getElementById('trxQty')?.value || 0);
            const hargaJual = Math.max(0, Number(document.getElementById('trxHargaJual')?.value || HARGA_JUAL_STANDAR));
            const total = qty * hargaJual;

            if (!box || !bayarInput) return;

            box.classList.remove('hidden');
            bayarInput.required = false;
            bayarInput.max = Math.max(0, total);

            if (mode === 'full') {
                box.classList.add('hidden');
                bayarInput.value = total;
            } else if (mode === 'deferred') {
                bayarInput.value = 0;
            } else {
                // Bayar Sebagian Dulu: boleh mulai dari Rp0.
                if (Number(bayarInput.value || 0) > total) {
                    bayarInput.value = total;
                }
            }

            updateTrxPaymentSummary();
        }

        function updateTrxPaymentSummary() {
            const qty = Number(document.getElementById('trxQty')?.value || 0);
            const hargaJual = Math.max(0, Number(document.getElementById('trxHargaJual')?.value || HARGA_JUAL_STANDAR));
            const total = qty * hargaJual;
            const mode = document.getElementById('trxPaymentMode')?.value;
            const bayarInput = document.getElementById('trxBayar');
            const summary = document.getElementById('trxPaymentSummary');
            if (!bayarInput || !summary) return;

            const bayar = mode === 'full'
                ? total
                : Math.max(0, Number(bayarInput.value || 0));
            const sisa = Math.max(0, total - bayar);

            if (mode === 'deferred') {
                summary.innerText = `Belum ada pembayaran. Sisa tagihan: Rp ${total.toLocaleString('id-ID')} — dibayar setelah tabung terjual.`;
            } else if (sisa > 0) {
                summary.innerText = `Sisa tagihan: Rp ${sisa.toLocaleString('id-ID')}`;
            } else {
                summary.innerText = 'Tagihan akan berstatus LUNAS.';
            }
        }

        function submitTransaction(e) {
            e.preventDefault();
            const db = getDB();
            const pangId = db.currentUser.pangkalanId;
            const inv = getPangkalanInventory(pangId);

           const custId = document.getElementById('trxCustId').value;

            const isNewPerorangan =
             custId === '__perorangan_baru__';


            let cust = db.customers.find(c => c.id === custId);
            
            if (custId === '__perorangan_baru__') {
                const namaPerorangan =
                    document.getElementById('trxNewPersonName')?.value.trim();
            
                const phonePerorangan =
                    document.getElementById('trxNewPersonPhone')?.value.trim() || '';
            
                if (!namaPerorangan) {
                    showAlert(
                        'Data Belum Lengkap',
                        'Nama pembeli perorangan wajib diisi.',
                        'error'
                    );
                    return;
                }

    cust = {
        id: 'cust_person_' + Date.now(),
        pangkalanId: pangId,
        name: namaPerorangan,
        type: 'perorangan',
        quotaMonthly: 4,
        phone: phonePerorangan
    };

    
            } else {
                if (!cust) return;
            }

            const qtyIsi = Number(document.getElementById('trxQty').value);
            const qtyKosong = Number(document.getElementById('trxQtyKosong').value);
            const hpp = Math.max(0, Number(document.getElementById('trxHpp').value || HET_PEMERINTAH));
            const hargaJual = Math.max(0, Number(document.getElementById('trxHargaJual').value || HARGA_JUAL_STANDAR));
            const totalHpp = qtyIsi * hpp;
            const total = qtyIsi * hargaJual;
            const profit = total - totalHpp;
            const paymentMode = document.getElementById('trxPaymentMode').value;
            const bayar = paymentMode === 'full' ? total : Number(document.getElementById('trxBayar').value || 0);

            if (qtyIsi > inv.stokIsiGudang) {
                showAlert('Transaksi Gagal', `Stok gas isi di pangkalan (${inv.stokIsiGudang} unit) tidak cukup!`, 'error');
                return;
            }

            if (bayar < 0) {
                showAlert('Pembayaran Gagal', 'Jumlah pembayaran tidak boleh kurang dari Rp 0.', 'error');
                return;
            }

            if (bayar > total) {
                showAlert('Pembayaran Gagal', 'Jumlah pembayaran tidak boleh melebihi total tagihan.', 'error');
                return;
            }

            if (paymentMode === 'partial' && bayar >= total) {
                showAlert('Pembayaran Gagal', 'Untuk pilihan Bayar Sebagian Dulu, jumlah pembayaran harus kurang dari total tagihan.', 'error');
                return;
            }

            if (paymentMode === 'deferred' && bayar !== 0) {
                showAlert('Pembayaran Gagal', 'Pilihan Bayar Nanti harus dicatat dengan pembayaran Rp 0.', 'error');
                return;
            }

            if (isNewPerorangan) {
    db.customers.push(cust);
}

            db.transactions.push({
                id: 'trx_' + Date.now(),
                pangkalanId: pangId,
                date: new Date().toISOString().slice(0, 10),
                customerId: cust.id,
                customerName: cust.name,
                customerType: cust.type,
                qty3kg: qtyIsi,
                qtyKosongDiambil: qtyKosong,
                modalPerTabung: hpp,
                hargaJual: hargaJual,
                totalHpp: totalHpp,
                profit: profit,
                totalHarga: total,
                bayar: bayar,
                statusBayar: bayar >= total ? 'lunas' : 'belum_lunas',
                catatan: paymentMode === 'full'
                    ? 'Transaksi Penjualan Pangkalan - Lunas'
                    : (paymentMode === 'deferred'
                        ? 'Transaksi Penjualan Pangkalan - Bayar Nanti Setelah Terjual'
                        : 'Transaksi Penjualan Pangkalan - Pembayaran Sebagian')
            });

            saveDB(db);
            closeModal();
            const sisa = Math.max(0, total - bayar);
            showAlert(
                'Transaksi Berhasil',
                sisa > 0
                    ? `Penjualan ${qtyIsi} tabung ke ${cust.name} tercatat. Dibayar Rp ${bayar.toLocaleString('id-ID')}, sisa Rp ${sisa.toLocaleString('id-ID')}.`
                    : `Penjualan ${qtyIsi} tabung ke ${cust.name} tercatat dan sudah LUNAS.`
            );
            render();
        }

        function deleteTransaction(trxId) {
        const db = getDB();
    
        const trx = (db.transactions || []).find(
            t => t.id === trxId
        );
    
        if (!trx) {
            showAlert(
                'Gagal',
                'Transaksi tidak ditemukan.',
                'error'
            );
            return;
        }
    
        if (trx.deletedAt) {
            showAlert(
                'Transaksi Sudah Dibatalkan',
                'Transaksi ini sudah dibatalkan sebelumnya.',
                'warning'
            );
            return;
        }
    
        const customerName =
            trx.customerName || 'pelanggan';
    
        const yakin = confirm(
            `Batalkan transaksi ${customerName} tanggal ${trx.date || '-'}?\n\n` +
            `Transaksi akan dikeluarkan dari perhitungan stok, piutang, dan histori aktif.`
        );
    
        if (!yakin) return;
    
        trx.deletedAt = new Date().toISOString();
    
        trx.deletedBy =
            db.currentUser?.username ||
            db.currentUser?.name ||
            'Admin Pangkalan';
    
        trx.deleteReason =
            'Transaksi dibatalkan oleh Admin Pangkalan';
    
        saveDB(db);
    
        render();
    
        showAlert(
            'Transaksi Dibatalkan',
            `Transaksi ${customerName} berhasil dibatalkan.`,
            'success'
        );
    }

function submitEditTransaction(e, trxId) {
    e.preventDefault();

    const db = getDB();

    const trx = (db.transactions || []).find(
        t => t.id === trxId
    );

    if (!trx) return;

    const pangId =
        db.currentUser?.pangkalanId;

    if (!pangId || trx.pangkalanId !== pangId) {
        showAlert(
            'Akses Ditolak',
            'Transaksi ini bukan milik pangkalan Anda.',
            'error'
        );
        return;
    }

    const customer =
        (db.customers || []).find(
            c => c.id === trx.customerId
        );

    const newDate =
        document.getElementById('editTrxDate').value;

    const newQty =
        Math.max(
            0,
            Number(
                document.getElementById('editTrxQty').value || 0
            )
        );

    const newQtyKosong =
        Math.max(
            0,
            Number(
                document.getElementById('editTrxQtyKosong').value || 0
            )
        );

    const newHpp =
        Math.max(
            0,
            Number(
                document.getElementById('editTrxHpp').value || 0
            )
        );

    const newHarga =
        Math.max(
            0,
            Number(
                document.getElementById('editTrxHarga').value || 0
            )
        );

    const newBayar =
        Math.max(
            0,
            Number(
                document.getElementById('editTrxBayar').value || 0
            )
        );

    const newCatatan =
        document.getElementById('editTrxCatatan').value.trim();

    if (!newDate) {
        showAlert(
            'Transaksi Gagal',
            'Tanggal transaksi wajib diisi.',
            'error'
        );
        return;
    }

    const totalBaru =
        newQty * newHarga;

    if (newBayar > totalBaru) {
        showAlert(
            'Pembayaran Tidak Valid',
            'Jumlah pembayaran tidak boleh melebihi total tagihan.',
            'error'
        );
        return;
    }

    /*
     * Cek stok pangkalan.
     *
     * Perhitungan menggunakan seluruh alokasi dikurangi
     * transaksi selain transaksi yang sedang diedit.
     */
    const totalAlokasi =
        (db.allocations || [])
            .filter(a => a.pangkalanId === pangId)
            .reduce(
                (sum, a) =>
                    sum + Number(a.isi3kg || 0),
                0
            );

    const totalTerjualLain =
        (db.transactions || [])
            .filter(t =>
                t.pangkalanId === pangId &&
                t.id !== trxId
            )
            .reduce(
                (sum, t) =>
                    sum + Number(t.qty3kg || 0),
                0
            );

    const stokTersediaUntukTransaksi =
        Math.max(
            0,
            totalAlokasi - totalTerjualLain
        );

    if (newQty > stokTersediaUntukTransaksi) {
        showAlert(
            'Stok Tidak Mencukupi',
            `Jumlah tabung isi baru ${newQty} melebihi stok yang tersedia untuk transaksi ini (${stokTersediaUntukTransaksi} tabung).`,
            'error'
        );
        return;
    }

    /*
     * Kuota pelanggan.
     *
     * Perorangan tetap mengikuti quotaMonthly.
     * Warung juga menggunakan quotaMonthly bila tersedia.
     */
    if (customer) {

        const quota =
            Number(
                customer.quotaMonthly ||
                (customer.type === 'warung' ? 60 : 4)
            );

        const month =
            String(newDate).slice(0, 7);

        const penggunaanLainBulan =
            (db.transactions || [])
                .filter(t =>
                    t.id !== trxId &&
                    t.customerId === customer.id &&
                    String(t.date || '').startsWith(month)
                )
                .reduce(
                    (sum, t) =>
                        sum + Number(t.qty3kg || 0),
                    0
                );

        if (
            penggunaanLainBulan + newQty >
            quota
        ) {
            showAlert(
                'Melebihi Kuota',
                `Kuota ${customer.name} adalah ${quota} tabung per bulan. Penggunaan setelah perubahan akan menjadi ${penggunaanLainBulan + newQty} tabung.`,
                'error'
            );
            return;
        }
    }

    const totalHpp =
        newQty * newHpp;

    const profit =
        totalBaru - totalHpp;

    trx.date = newDate;
    trx.qty3kg = newQty;
    trx.qtyKosongDiambil = newQtyKosong;

    trx.modalPerTabung = newHpp;
    trx.hargaJual = newHarga;
    trx.hargaJualPerTabung = newHarga;

    trx.totalHpp = totalHpp;
    trx.profit = profit;
    trx.totalHarga = totalBaru;
    trx.bayar = newBayar;

    trx.statusBayar =
        newBayar >= totalBaru
            ? 'lunas'
            : 'belum_lunas';

    trx.catatan =
        newCatatan || 'Transaksi diedit oleh Admin Pangkalan';

    trx.updatedAt =
        new Date().toISOString();

    saveDB(db);

    closeModal();
    render();

    showAlert(
        'Transaksi Diperbarui',
        `Histori transaksi ${customer?.name || trx.customerName || 'pelanggan'} berhasil diperbarui.`
    );
}

        function confirmResetAgencyReturns() {
            const db = getDB();
            const pangId = db.currentUser?.pangkalanId;

            const oldReturns = (db.emptyReturnsToAgency || [])
                .filter(r => r.pangkalanId === pangId);
            const qtyRemoved = oldReturns.reduce((s,r) => s + Number(r.qtyKosong || 0), 0);
            const ids = new Set(oldReturns.map(r => r.id));

            // Reset hanya setoran milik pangkalan aktif.
            db.emptyReturnsToAgency = (db.emptyReturnsToAgency || [])
                .filter(r => r.pangkalanId !== pangId);

            // Sesuaikan wadah Super Admin untuk receipt yang sama.
            db.emptyAgencyReceipts = (db.emptyAgencyReceipts || [])
                .filter(r => !(r.pangkalanId === pangId && ids.has(r.id)));

            if (!db.superAdminStock) {
                db.superAdminStock = { isi3kg: 0, kosong3kg: 0 };
            }
            db.superAdminStock.kosong3kg = Math.max(
                0,
                Number(db.superAdminStock.kosong3kg || 0) - qtyRemoved
            );

            saveDB(db);
            closeModal();

            showAlert(
                'Setoran Direset',
                `Data setoran ${qtyRemoved} tabung untuk pangkalan ini sudah dikembalikan menjadi 0.`
            );
            render();
        }

        function submitReturnEmpty(e) {
            e.preventDefault();

            const db = getDB();
            const pangId = db.currentUser?.pangkalanId;
            const inv = getPangkalanInventory(pangId);
            const qty = Math.max(0, Number(document.getElementById('retQty').value || 0));

            if (qty <= 0) {
                showAlert('Penyetoran Gagal', 'Jumlah tabung kosong harus lebih dari 0.', 'error');
                return;
            }

            if (qty > Number(inv.stokKosongFisik || 0)) {
                showAlert(
                    'Penyetoran Gagal',
                    `Stok tabung kosong pangkalan hanya ${Number(inv.stokKosongFisik || 0)} unit.`,
                    'error'
                );
                return;
            }

            if (!db.superAdminStock) {
                db.superAdminStock = { isi3kg: 0, kosong3kg: 0 };
            }

            if (!db.emptyReturnsToAgency) db.emptyReturnsToAgency = [];
            if (!db.emptyAgencyReceipts) db.emptyAgencyReceipts = [];

            const pangkalan = (db.pangalans || []).find(p => p.id === pangId);
            const pangkalanName = pangkalan?.name || `Pangkalan ${pangId}`;

            const now = new Date().toISOString();
            const receiptId = 'empty_receipt_' + Date.now();

            // Ledger operasional pangkalan -> agen.
            db.emptyReturnsToAgency.push({
                id: receiptId,
                pangkalanId: pangId,
                pangkalanName,
                date: now.slice(0, 10),
                createdAt: now,
                qtyKosong: qty,
                sumber: 'stok_kosong_pangkalan',
                jenis: 'tabung_kosong',
                tujuan: 'agen',
                status: 'Diterima Agen'
            });

            // Wadah khusus Super Admin: stok + riwayat penerimaan.
            db.emptyAgencyReceipts.push({
                id: receiptId,
                pangkalanId: pangId,
                pangkalanName,
                date: now.slice(0, 10),
                createdAt: now,
                qtyKosong: qty,
                status: 'Diterima',
                keterangan: 'Setoran tabung kosong dari Admin Pangkalan'
            });

            // Hanya stok KOSONG agen yang bertambah.
            db.superAdminStock.kosong3kg =
                Number(db.superAdminStock.kosong3kg || 0) + qty;

            saveDB(db);
            closeModal();

            showAlert(
                'Setoran Berhasil',
                `${qty} tabung kosong dari ${pangkalanName} masuk ke Stok Kosong Gudang Agen.`
            );

            render();
        }

        async function submitAddCustomer(event) {
            event.preventDefault();

            const db = getDB();
            const actor = db.currentUser;
            const pangId = actor?.pangkalanId;

            if (!pangId) {
                showAlert('Gagal', 'Pangkalan aktif tidak ditemukan.', 'error');
                return;
            }

            const name = document.getElementById('custName')?.value.trim() || '';
            const type = document.getElementById('custType')?.value || 'warung';
            const quota = Number(document.getElementById('custQuota')?.value || 0);
            const username = document.getElementById('custUsername')?.value.trim().toLowerCase() || '';
            const password = document.getElementById('custPassword')?.value.trim() || '';

            if (!name) {
                showAlert('Gagal', 'Nama pelanggan wajib diisi.', 'error');
                return;
            }

            if (!['warung', 'perorangan'].includes(type)) {
                showAlert('Gagal', 'Tipe pelanggan tidak valid.', 'error');
                return;
            }

            if (type === 'warung' && (!username || !password)) {
                showAlert('Gagal', 'Username dan password warung wajib diisi.', 'error');
                return;
            }

            const duplicateUsername = type === 'warung' && (db.customers || []).some(c =>
                String(c.pangkalanId) === String(pangId) &&
                c.type === 'warung' &&
                String(c.username || '').trim().toLowerCase() === username
            );

            if (duplicateUsername) {
                showAlert(
                    'Gagal Menambahkan',
                    `Username "${username}" sudah digunakan di pangkalan ini.`,
                    'error'
                );
                return;
            }

            const customer = {
                id: 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                pangkalanId: pangId,
                name,
                type,
                quotaMonthly: quota > 0 ? quota : (type === 'warung' ? 60 : 4),
                username,
                password,
                phone: '0812345678'
            };

            // Kembalikan alur frontend yang sebelumnya sudah berjalan:
            // masukkan customer ke database lokal, simpan melalui saveDB(),
            // lalu render ulang daftar pelanggan.
            db.customers = Array.isArray(db.customers) ? db.customers : [];
            db.customers.push(customer);

            saveDB(db);

            closeModal();

            showAlert(
                'Berhasil Ditambahkan',
                `${type === 'warung' ? 'Warung' : 'Pelanggan'} "${name}" berhasil ditambahkan ke daftar pelanggan.`
            );

            render();
        }

       function submitWarungRetailSale(e) {
    e.preventDefault();

    const db = getDB();
    const user = db.currentUser;

    if (!user || user.role !== 'warung') {
        showAlert(
            'Akses Ditolak',
            'Akun Warung tidak ditemukan.',
            'error'
        );
        return;
    }

    const qty = Math.max(
        1,
        Number(
            document.getElementById('retailQty')?.value || 0
        )
    );

    const note =
        document.getElementById('retailNote')?.value.trim() ||
        'Penjualan eceran warung';

    // Cek stok sebelum penjualan
    const invSebelum = getWarungInventory(user.id);

    const stokIsiSebelum =
        Number(invSebelum.estimasiStokIsiWarung || 0);

    if (qty > stokIsiSebelum) {
        showAlert(
            'Penjualan Gagal',
            `Stok isi warung tidak cukup. Sisa stok isi: ${stokIsiSebelum} tabung.`,
            'error'
        );
        return;
    }

    if (!db.warungSales) {
        db.warungSales = [];
    }

    if (!db.warungReports) {
        db.warungReports = [];
    }

    const now = new Date();
    const saleId = 'sale_' + Date.now();

    // =========================================================
    // 1. SIMPAN PENJUALAN WARUNG
    // =========================================================
    db.warungSales.push({
        id: saleId,
        customerId: user.id,
        pangkalanId: user.pangkalanId,
        warungName: user.name,
        date: now.toISOString().slice(0, 10),
        createdAt: now.toISOString(),
        qty: qty,
        note: note
    });

    // =========================================================
    // 2. HITUNG STOK TERBARU SETELAH PENJUALAN
    // =========================================================
    const invSesudah = getWarungInventory(user.id);

    const stokIsi =
        Number(invSesudah.estimasiStokIsiWarung || 0);

    const stokKosong =
        Number(invSesudah.estimasiStokKosongWarung || 0);

    // =========================================================
    // 3. AMBANG OTOMATIS
    // =========================================================
   const ambangKosong = 5;
    const ambangIsi = 5;
    
    const perluTindakan =
        stokIsi <= ambangIsi ||
        stokKosong >= ambangKosong;

    // =========================================================
    // 4. CARI PERMINTAAN AKTIF WARUNG INI
    //    HANYA SATU PERMINTAAN PENDING PER WARUNG
    // =========================================================
    let report = db.warungReports.find(r =>
        r.customerId === user.id &&
        r.pangkalanId === user.pangkalanId &&
        r.status === 'pending'
    );

    // =========================================================
    // 5. BUAT / PERBARUI PERMINTAAN OTOMATIS
    // =========================================================
    if (perluTindakan) {

        if (!report) {
            report = {
                id: 'rep_auto_' + Date.now(),
                pangkalanId: user.pangkalanId,
                customerId: user.id,
                warungName: user.name,

                status: 'pending',

                source: 'auto_retail_sale',

                createdAt: now.toISOString(),
                date: now.toISOString().slice(0, 10),

                lastSaleId: saleId,
                lastSaleQty: qty,

                isi3kg: stokIsi,
                kosong3kg: stokKosong,

                stokIsiSaatLaporan: stokIsi,
                stokKosongSaatLaporan: stokKosong,

                ambangIsi: ambangIsi,
                ambangKosong: ambangKosong,

                prioritas:
                    stokIsi <= 1 || stokKosong >= 10
                        ? 'tinggi'
                        : 'normal',

                catatan:
                    `Otomatis dari penjualan Warung. ` +
                    `Stok isi ${stokIsi} unit, ` +
                    `stok kosong ${stokKosong} unit.`
            };

            db.warungReports.push(report);

        } else {
            // Perbarui permintaan aktif yang sama
            report.date = now.toISOString().slice(0, 10);

            report.lastSaleId = saleId;
            report.lastSaleQty = qty;

            report.isi3kg = stokIsi;
            report.kosong3kg = stokKosong;

            report.stokIsiSaatLaporan = stokIsi;
            report.stokKosongSaatLaporan = stokKosong;

            report.ambangIsi = ambangIsi;
            report.ambangKosong = ambangKosong;

            report.prioritas =
                stokIsi <= 1 || stokKosong >= 10
                    ? 'tinggi'
                    : 'normal';

            report.catatan =
                `Diperbarui otomatis dari penjualan Warung. ` +
                `Stok isi ${stokIsi} unit, ` +
                `stok kosong ${stokKosong} unit.`;
        }
    }

    // =========================================================
    // 6. SIMPAN DATABASE
    // =========================================================
    saveDB(db);

    closeModal();

    // =========================================================
    // 7. PESAN KE WARUNG
    // =========================================================
    if (perluTindakan) {

        showAlert(
            'Penjualan Dicatat',
            `${qty} tabung terjual. ` +
            `Stok sekarang ${stokIsi} isi dan ${stokKosong} kosong. ` +
            `Pangkalan akan menerima permintaan otomatis.`
        );

    } else {

        showAlert(
            'Penjualan Dicatat',
            `${qty} tabung terjual. ` +
            `Stok sekarang ${stokIsi} isi dan ${stokKosong} kosong.`
        );
    }

    render();
}
        function getWarungTransactionPrice(customerId) {
            const db = getDB();
            const trxs = (db.transactions || [])
                .filter(t => t.customerId === customerId)
                .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));

            if (!trxs.length) return 0;

            const first = trxs[0];
            const qty = Number(first.qty3kg || 0);
            if (Number(first.hargaPerTabung || 0) > 0) return Number(first.hargaPerTabung);
            if (Number(first.hargaJualPerTabung || 0) > 0) return Number(first.hargaJualPerTabung);
            if (Number(first.totalHarga || 0) > 0 && qty > 0) return Number(first.totalHarga) / qty;

            return 0;
        }
